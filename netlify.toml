[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA fallback only. /api/chat is served by netlify/functions/chat.ts
# via export const config = { path: "/api/chat" }.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
